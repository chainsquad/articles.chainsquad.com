---
layout: default
---

<article>
  <header class="mb-10">
    <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-3">{{ page.title }}</h1>
    <time class="text-xs text-muted-foreground uppercase tracking-[0.12em]" datetime="{{ page.date | date_to_xmlschema }}">
      {{ page.date | date: "%-d %B %Y" }}
    </time>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
